name: Build & Validate OpenROM Catalog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Plugin Manifests
        run: python scripts/validate_plugin.py

      - name: Build Catalog API
        run: python scripts/build_catalog.py

      - name: Commit and Push Catalog Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/api/catalog.json
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "build: update catalog.json [skip ci]"
            git push
          fi
